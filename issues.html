<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issues | Github Issue Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">
</head>

<body class="bg-[#F8FAFC]">

    <nav>
        <div class="navbar bg-base-100 shadow-sm p-4 sticky">
            <div class="flex-0.8 md:flex-1">
                <a href="issues.html"
                    class="btn btn-ghost text-xl pl-2 pr-2 border-none hover:bg-white hover:border-none hover:shadow-none md:pl-4 md:pr-4">
                    <img src="./assets/github-logo.png" alt="" class="w-9"> <span
                        class="text-2xl font-semibold hidden md:block">GitHub Issues Tracker</span>
                </a>
            </div>
            <div class="flex gap-2">
                <div class="relative">
                    <span class="absolute inset-y-0 left-3 top-1/2 -translate-y-1/2 text-gray-400 z-10">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </span>
                    <input type="text" placeholder="Search Issues..."
                        class="input input-bordered pl-10 pr-4 focus:border-[#4A00FF] focus:outline-none focus:ring-0 w-[150px] md:w-auto" />
                </div>

                <div class="dropdown dropdown-end">
                    <button class="btn btn-primary wrap-break-word lg:break-normal"><i class="fa-solid fa-plus"></i> New
                        Issue</button>
                </div>
            </div>
        </div>
    </nav>
    <main class="my-15 max-w-10/12 mx-auto">
        <section class="toogle-bar bg-white p-6 rounded-lg shadow">
            <div class="toogle-bar-container flex gap-2">
                <button id="all-btn"
                    class="all-btn togler-btn w-[120px] p-3 bg-[#4A00FF] text-white text-base text-center font-semibold rounded-lg cursor-pointer">All</button>
                <button id="open-btn"
                    class="open-btn togler-btn w-[120px] p-3 bg-white text-[#64748B] outline-1 outline-[#E4E4E7] text-base text-center font-semibold rounded-lg cursor-pointer">Open
                </button>
                <button id="closed-btn"
                    class="closed-btn togler-btn w-[120px] p-3 bg-white text-[#64748B] outline-1 outline-[#E4E4E7] text-base text-center font-semibold rounded-lg cursor-pointer">Closed</button>
            </div>
        </section>
        <section class="issue-container shadow-lg">
            <div class="issues-bar bg-white p-6 rounded-t-lg my-4 shadow">
                <div class="issues-bar-container flex gap-2 justify-between">
                    <div class="start items-center flex">
                        <div class="aperture w-[50px] bg-[#ECE4FF] p-2 rounded-full mr-2">
                            <img src="./assets/Aperture.png" alt="">
                        </div>
                        <div class="issue-counter">
                            <h2 class="text-[#1F2937] text-xl font-bold"><span id="total-issues">0</span> Issues</h2>
                            <p class="text-[#64748B]">Track and manage your project issues</p>
                        </div>
                    </div>
                    <div class="end items-center flex gap-4">
                        <div class="open-status flex items-center">
                            <span class="w-3 h-3 rounded-full bg-[#00A96E]"></span>
                            <p class="ml-1">Open</p>
                        </div>
                        <div class="closed-status flex items-center">
                            <span class="w-3 h-3 rounded-full bg-[#A855F7]"></span>
                            <p class="ml-1">Closed</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-6">
                <div id="issues-card-container" class="issue-cards grid grid-cols-4 gap-3">

                    <!-- ekhane issue card gulo render hobe -->
                </div>
                <!-- spinner part -->
                <div class="spinner-loading py-5 flex justify-center items-center">
                    <span class="loading loading-spinner loading-xs"></span>
                </div>
            </div>
        </section>

        <section class="dtls-modal">
            <!-- Open the modal using ID.showModal() method -->
            
            <dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
                <!-- ekhane render hobe amr js theke single issue er content -->
                 
            </dialog>
        </section>

    </main>
    <script src="./scripts/issues.js"></script>
</body>

</html>
